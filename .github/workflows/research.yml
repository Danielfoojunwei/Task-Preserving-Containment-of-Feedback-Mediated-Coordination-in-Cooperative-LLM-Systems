name: Offline research validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ''
      PYTHONDONTWRITEBYTECODE: '1'
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test and analysis dependencies
        run: python -m pip install -e 'research[test]' numpy==2.2.6 scipy==1.17.0 jsonschema==4.26.0 matplotlib==3.10.8
      - name: Verify imported source and evidence bytes
        run: python scripts/verify_research_snapshot.py
      - name: Core overlay tests
        working-directory: research
        run: python -m pytest -q tests
      - name: Provider-client and canned-integration checks
        working-directory: research/outputs/controlplane_20261015
        run: python -m unittest -q test_api_client test_integration
      - name: Host-mask offline self-test
        run: python research/outputs/hostmask_20261015/run_hostmask.py --self-test
      - name: Reproduce both frozen primary analyses without model calls
        run: python research/outputs/controlplane_release_20261015/reproduce_offline.py --out "$RUNNER_TEMP/controlplane-reproduced"
      - name: Fresh-world ablation runner and analysis checks
        run: python -m unittest discover -s research/outputs/stability_20261015 -p 'test*.py' -q
      - name: Independently reconstruct held-out ablations and announcement effects
        run: python research/outputs/stability_20261015/independent_stability_check.py
      - name: Agreement experiments — offline interface and continuation checks
        run: |
          python -m unittest discover -s research/outputs/agreement_pilot_20261015 -p 'test_pilot.py' -q
          python -m unittest discover -s research/outputs/agreement_capability_20261015 -p 'test_pilot.py' -q
          python -m unittest discover -s research/outputs/agreement_adversarial_20261015 -p 'test_pilot.py' -q
      - name: Restore hash-checked historical archive metadata
        # Git drops mtimes. Restore the released ZIP's local metadata only after
        # checking unchanged bytes; this is not external temporal attestation.
        run: python scripts/restore_agreement_archive_mtimes.py
      - name: Independently reconstruct agreement experiment records
        run: |
          python research/outputs/agreement_pilot_20261015/independent_verify.py --output-dir "$RUNNER_TEMP/agreement-original-audit"
          python research/outputs/agreement_pilot_20261015/independent_verify.py --root research/outputs/agreement_capability_20261015 --output-dir "$RUNNER_TEMP/agreement-capability-audit"
          python research/outputs/agreement_pilot_20261015/independent_verify.py --root research/outputs/agreement_adversarial_20261015 --output-dir "$RUNNER_TEMP/agreement-adversarial-audit"
      - name: Repeated reciprocity — offline interface, inference, and independent-verifier tests
        run: python -m unittest discover -s research/outputs/reciprocity_causal_20261016 -p 'test*.py' -q
      - name: Negotiation supplement — offline interface, inference, and independent-verifier tests
        run: python -m unittest discover -s research/outputs/negotiation_causal_20261016 -p 'test*.py' -q
      - name: Adaptive defense — offline source-state and enforcement checks
        run: python -m unittest discover -s research/outputs/negotiation_defense_20261016 -p 'test*.py' -q
      - name: Independently reconstruct completed repeated-reciprocity records
        if: ${{ hashFiles('research/outputs/reciprocity_causal_20261016/validation_completion.json') != '' }}
        run: python research/outputs/reciprocity_causal_20261016/independent_verify.py --phase all --output-dir "$RUNNER_TEMP/reciprocity-causal-audit"
      - name: Independently reconstruct completed supplement and joint inference
        if: ${{ hashFiles('research/outputs/negotiation_causal_20261016/validation_completion.json') != '' }}
        run: python research/outputs/negotiation_causal_20261016/independent_verify.py --release --parent-verification "$RUNNER_TEMP/reciprocity-causal-audit/INDEPENDENT_VERIFICATION_ALL.json" --output-dir "$RUNNER_TEMP/negotiation-causal-audit"
      - name: Independently reconstruct adaptive defense branches
        if: ${{ hashFiles('research/outputs/negotiation_defense_20261016/continuation_completion.json') != '' }}
        run: python research/outputs/negotiation_defense_20261016/independent_verify.py --release --output-dir "$RUNNER_TEMP/negotiation-defense-audit"
      - name: Overt and covert agreement — frozen runner, inference, verifier and review-seal checks
        run: python -m unittest discover -s research/outputs/overt_covert_relaunch_20261016 -p 'test*.py' -q
      - name: All-source context and settlement continuation checks
        run: python -m unittest discover -s research/outputs/overt_covert_continuations_20261016 -p 'test*.py' -q
      - name: Evidence display arithmetic, provenance and synthetic replay checks
        run: python -m unittest discover -s research/outputs/overt_covert_release_20261016 -p 'test*.py' -q
      - name: Independently reconstruct completed consequential-oversight experiment
        if: ${{ hashFiles('research/outputs/overt_covert_relaunch_20261016/validation_completion.json') != '' }}
        run: python research/outputs/overt_covert_relaunch_20261016/independent_verify.py --phase all --release --output-dir "$RUNNER_TEMP/overt-covert-main-audit"
      - name: Independently reconstruct completed all-source continuations
        if: ${{ hashFiles('research/outputs/overt_covert_continuations_20261016/continuations_completion.json') != '' }}
        run: python research/outputs/overt_covert_continuations_20261016/independent_verify.py --release --output-dir "$RUNNER_TEMP/overt-covert-continuation-audit"
