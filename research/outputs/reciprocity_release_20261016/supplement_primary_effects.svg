   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4d5962" transform="translate(357.400703 394.198594)">Intervals: 20,000 paired-block bootstrap draws, descriptive 95%. Tests: all 256 swaps; two-sided; Holm family = 2.</text>
